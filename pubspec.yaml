name: dither_animals
description: Animated dithered animal widgets for Flutter with 50 cute chibi presets, ordered dithering, ripple poke physics, facial expressions, signature moves, and studio.
version: 2.0.0
homepage: https://github.com/ayan15888/dither_animals
repository: https://github.com/ayan15888/dither_animals
issue_tracker: https://github.com/ayan15888/dither_animals/issues

topics:
  - animation
  - canvas
  - dithering
  - graphics
  - widgets

screenshots:
  - description: 'Gallery grid of cute animated dithered animals rendered with ordered Bayer matrix dithering.'
    path: doc/preview.png
  - description: 'Detailed view of chibi dithered animals with multi-layer density shading and expressions.'
    path: doc/animals_detail.png
  - description: 'Live animation demo showing idle motions, interactive poke ripples, and sparkles.'
    path: doc/preview.gif

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  path_drawing: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
