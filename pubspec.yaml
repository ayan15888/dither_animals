name: dither_animals
description: Animated dithered (stipple and halftone) animal widgets for Flutter with 30 cute chibi animals, ordered dithering, and ripple poke physics.
version: 1.0.0
homepage: https://github.com/flutter_community/dither_animals
repository: https://github.com/flutter_community/dither_animals
issue_tracker: https://github.com/flutter_community/dither_animals/issues

topics:
  - animation
  - canvas
  - dithering
  - graphics
  - widgets

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  path_drawing: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
